name: Build Fast Radio

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check project files
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Build debug APK and show the real error
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug --stacktrace --info 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          echo "BUILD EXIT CODE: $STATUS" | tee -a build.log
          exit "$STATUS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fast-Radio-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fast-Radio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
